[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"enlidea/settings/*" = ["F403"]

[tool.pyright]
typeCheckingMode = "standard"
reportAttributeAccessIssue = "none"
reportIncompatibleVariableOverride = "none"
venvPath = "."
venv = "enlivenv"
