name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: enlidea
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        command: redis-server --requirepass test-redis-password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test-redis-password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-of-at-least-50-characters-long-for-security-check
      SIGNING_KEY: test-signing-key-long-enough-for-jwt-verification
      DB_NAME: enlidea
      DB_USER: postgres
      DB_PASS: password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_PASSWORD: test-redis-password
      CELERY_BROKER_URL: redis://:test-redis-password@localhost:6379/0
      CELERY_RESULT_BACKEND: redis://:test-redis-password@localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: admin/
      DJANGO_SETTINGS_MODULE: enlidea.settings.development
      EMAIL_HOST_USER: test@example.com
      EMAIL_HOST_PASSWORD: test-password

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run Linter (Ruff)
      run: |
        ruff check .
        
    - name: Run Typecheck (Pyright)
      run: |
        pyright
        
    - name: Check for Missing Migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run Tests
      run: |
        python manage.py test

    - name: Generate OpenAPI Schema
      run: |
        python manage.py spectacular --file frontend/openapi.yml --validate

    - name: Verify OpenAPI Schema is Up to Date
      run: |
        git diff --exit-code frontend/openapi.yml


  compose-smoke-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate Production & Dev Docker Compose Configurations
      run: |
        cp .env.example .env
        docker compose config --quiet
        docker compose -f docker-compose.yml -f docker-compose.override.example.yml config --quiet

    - name: Build Backend Image and Verify Non-Root Volume Permissions
      run: |
        docker build -t enlidea-backend:1.1.0 .
        docker run --rm enlidea-backend:1.1.0 python -c "import os, sys, textwrap; exec(textwrap.dedent('''
            media_writable = os.access('/app/media', os.W_OK)
            static_writable = os.access('/app/staticfiles', os.W_OK)
            print(f'/app/media writable by non-root: {media_writable}')
            print(f'/app/staticfiles writable by non-root: {static_writable}')
            if not (media_writable and static_writable):
                sys.exit(1)
        '''))"


  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
      working-directory: frontend
    - name: Run Linter
      run: npm run lint
      working-directory: frontend
    - name: Run Tests
      run: npm run test -- --run
      working-directory: frontend
    - name: Build Frontend
      run: npm run build
      working-directory: frontend

