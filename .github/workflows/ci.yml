name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: enlidea
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key
      SIGNING_KEY: test-signing-key
      DB_NAME: enlidea
      DB_USER: postgres
      DB_PASS: password
      DB_HOST: localhost
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      ADMIN_URL: admin/
      DJANGO_SETTINGS_MODULE: enlidea.settings.development
      EMAIL_HOST_USER: test@example.com
      EMAIL_HOST_PASSWORD: test-password

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run Linter (Ruff)
      run: |
        ruff check .
        
    - name: Run Typecheck (Pyright)
      run: |
        pyright
        
    - name: Run Tests
      run: |
        python manage.py test

    - name: Generate OpenAPI Schema
      run: |
        python manage.py spectacular --file frontend/openapi.yml --validate

    - name: Upload OpenAPI Schema Artifact
      uses: actions/upload-artifact@v4
      with:
        name: openapi-schema
        path: frontend/openapi.yml

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
    - uses: actions/checkout@v4

    - name: Download OpenAPI Schema Artifact
      uses: actions/download-artifact@v4
      with:
        name: openapi-schema
        path: frontend

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
      working-directory: frontend
    - name: Run Linter
      run: npm run lint
      working-directory: frontend
    - name: Run Tests
      run: npm run test -- --run
      working-directory: frontend
    - name: Build Frontend
      run: npm run build
      working-directory: frontend
