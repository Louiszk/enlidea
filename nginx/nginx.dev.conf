worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Strict global body size limit (1MB)
    client_max_body_size 1M;

    # ----------------------------------------
    # Main Website (React Frontend & Django API) - Local HTTP Development
    # ----------------------------------------
    server {
        listen 80;
        server_name _;

        # Allow larger uploads for specific endpoints (10MB)
        location ~ ^/api/v1/nodes/[^/]+/(attachments|finalize)/?$ {
            client_max_body_size 10M;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /api/, /auth-api/, etc. to the Django Backend
        location ~ ^/(api|auth-api|social-api|admin)/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /mcp to FastMCP Server (Streamable HTTP Transport)
        location /mcp {
            proxy_pass http://mcp:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            keepalive_timeout 600s;
            proxy_set_header Connection '';
        }

        # Route media files (User Avatars, etc.)
        location /media/ {
            alias /var/www/media/;
            autoindex off;
            access_log off;
            expires 7d;
            add_header X-Content-Type-Options nosniff;
        }

        # Route static files to Django (Whitenoise)
        location /static/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route everything else to the React Frontend
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for React Dev Server
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ----------------------------------------
    # MCP Server Subdomain (Local Port 8001)
    # ----------------------------------------
    server {
        listen 8001;
        server_name _;

        location / {
            proxy_pass http://mcp:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # Disable proxy buffering for Streamable HTTP
            proxy_buffering off;
            proxy_cache off;
            
            # Higher timeouts for long-running MCP tool executions
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            keepalive_timeout 600s;

            # Streamable HTTP specific headers
            proxy_set_header Connection '';
        }
    }
}
